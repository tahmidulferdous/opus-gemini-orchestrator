name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq sqlite3

      - name: Shellcheck
        run: shellcheck -S error skills/opus-gemini-orchestrator/bin/* skills/opus-gemini-orchestrator/scripts/*.sh tests/*.sh

      - name: Run script tests
        run: bash tests/test_scripts.sh

      - name: Run install tests
        run: bash tests/test_install.sh
